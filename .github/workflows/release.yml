name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="v0.1.8: Tarayıcı sağ tık menüsü kaldırıldı; mesaj, input, seçili metin, link, medya, kanal, DM, üye, sunucu ve profil için Discord benzeri özel context menüleri eklendi."
          gh release create "$GITHUB_REF_NAME" \
            --title "SlopSound $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" || true
          gh release edit "$GITHUB_REF_NAME" --notes "$NOTES"
      - name: Resolve release id
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "id=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME --jq .id)" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --config release-config.json --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows code signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          $raw = $env:WINDOWS_CERTIFICATE.Trim()
          if (-not $raw) { throw "WINDOWS_CERTIFICATE secret is required" }
          $clean = $raw -replace "-----BEGIN[^-]+-----", "" -replace "-----END[^-]+-----", "" -replace "\s", ""
          $bytes = $null
          for ($i = 0; $i -lt 3; $i++) {
            try { $bytes = [Convert]::FromBase64String($clean) } catch { throw "WINDOWS_CERTIFICATE is not valid base64" }
            $text = [Text.Encoding]::ASCII.GetString($bytes)
            if ($text -match "-----BEGIN") {
              $clean = $text -replace "-----BEGIN[^-]+-----", "" -replace "-----END[^-]+-----", "" -replace "\s", ""
              continue
            }
            if ($text -match "^[A-Za-z0-9+/=\r\n]+$") {
              $clean = $text -replace "\s", ""
              continue
            }
            break
          }
          if ($null -eq $bytes -or $bytes.Length -lt 2 -or $bytes[0] -ne 0x30) { throw "WINDOWS_CERTIFICATE did not decode to a PFX" }
          [IO.File]::WriteAllBytes("certificate/certificate.pfx", $bytes)
          "pfx_bytes=$($bytes.Length)"
          "pfx_prefix=$([BitConverter]::ToString($bytes[0..([Math]::Min(7, $bytes.Length - 1))]))"
          $password = if ($env:WINDOWS_CERTIFICATE_PASSWORD) { ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText } else { New-Object System.Security.SecureString }
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password

      - name: Write Windows signing config
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw "WINDOWS_CERTIFICATE_THUMBPRINT secret is required" }
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -Path release-config.json

      - name: Build and publish ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://slopsound.onrender.com
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  finalize:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/generate-latest-json.mjs

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
